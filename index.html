<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple to-do list app to organize your daily tasks.">
  <title>Daily Tasks | To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">MAKE TODAY COUNT</p>
      <h1>My To-Do List <span aria-hidden="true">✦</span></h1>
      <p class="subtitle">Small steps make big progress.</p>
    </header>
    <section class="task-panel" aria-label="Task manager">
      <form id="task-form" class="task-form">
        <label class="sr-only" for="task-input">Enter a task</label>
        <input id="task-input" type="text" placeholder="What do you need to do?" maxlength="120" autocomplete="off" required>
        <button type="submit" class="add-button">Add task <span aria-hidden="true">+</span></button>
      </form>
      <div class="toolbar">
        <p id="task-count" aria-live="polite">0 tasks left</p>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button type="button" class="filter active" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button>
          <button type="button" class="filter" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
      </div>
      <ul id="task-list" class="task-list" aria-label="Your tasks"></ul>
      <p id="empty-state" class="empty-state">You're all caught up. Add a task to get started!</p>
      <footer class="list-footer">
        <span id="completed-count">0 completed</span>
        <button id="clear-completed" type="button" class="text-button">Clear completed</button>
      </footer>
    </section>
    <p class="note">Your tasks are saved in this browser on this device.</p>
  </main>
</body>
</html>
